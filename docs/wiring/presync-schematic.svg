<text class="net" x="296" y="473">VCC (internal pullup)</text>
<text class="pin" x="596" y="562" text-anchor="middle">SW1</text>
<text class="lbl" x="24" y="578" font-weight="600">Notes</text>
<text class="pin" x="24" y="600" font-weight="600">R1-R8 &#8212; Series output resistors</text>
<text class="note" x="24" y="616">One per channel, in series with the driver pin. Limits fault current if an output is shorted or driven by the far end, and damps</text>
<text class="note" x="24" y="630">reflections on a long cable. Value set at build.</text>
<text class="pin" x="24" y="650" font-weight="600">R9 &#8212; 1k series, TRIG IN</text>
<text class="note" x="24" y="666">Protects the input pin from an out-of-range master. The pin's internal pullup holds the line HIGH when nothing is connected.</text>
<text class="pin" x="24" y="686" font-weight="600">JTD &#8212; MCUCR bit, cleared at startup</text>
<text class="note" x="24" y="702">A3-A0 are PF4-PF7, the JTAG pins TCK/TMS/TDO/TDI. With the factory JTAGEN fuse, JTAG owns them and a PORTF write does nothing -- four</text>
<text class="note" x="24" y="716">channels would never toggle, with a clean compile and a correct-looking config. Setting JTD in MCUCR releases them; the write must</text>
<text class="note" x="24" y="730">happen twice within four clock cycles or the hardware ignores it.</text>
<text class="pin" x="24" y="750" font-weight="600">SW1 &#8212; SPDT FREE/TRIG</text>
<text class="note" x="24" y="766">FREE RUN is the OPEN throw. With INPUT_PULLUP, an unwired or failed-open switch reads HIGH = FREE RUN and the box emits. Fails into</text>
<text class="note" x="24" y="780">working.</text>
<text class="note" x="1296" y="746" text-anchor="end">Generated from docs/wiring/presync-schematic.yml &#183; do not edit by hand</text>
